name: case-adm-judicial

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case_adm}
      POSTGRES_USER: ${POSTGRES_USER:-case_adm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case_adm_dev}
      # Feeds the entrypoint script that creates the least-privilege app role.
      # Dev-only default, same convention as POSTGRES_PASSWORD above.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-case_adm_app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first initialization — creates case_adm_app with DML-only
      # grants plus default privileges for future tables.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed for host dev (pnpm dev runs on host against compose DB).
      # Not published in production stack — see docker-compose.production.yml
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-case_adm} -d ${POSTGRES_DB:-case_adm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: server -dir=/data -s3 -filer -volume.max=0
    environment:
      WEED_S3_CONFIG_DIR: /etc/seaweedfs
    volumes:
      - seaweedfs_data:/data
    ports:
      - "8333:8333" # S3 gateway — internal only; exposed locally for dev
      - "9333:9333" # filer
      - "19333:19333" # master
    healthcheck:
      # 127.0.0.1, not localhost: on alpine `localhost` resolves to ::1 first and
      # the services bind IPv4 only, which would leave the container unhealthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root context: the Dockerfile installs the pnpm workspace, so it needs the
      # root manifests and pnpm-lock.yaml. Volumes below do the hot-reload.
      context: ..
      dockerfile: backend/Dockerfile
      target: base
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install && pnpm --filter backend prisma:generate && pnpm --filter backend prisma:deploy || true && pnpm --filter backend dev"
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Runtime uses the least-privilege role; migrations use the owner.
      # Dev-only defaults, same convention as the postgres service above.
      DATABASE_URL: ${DATABASE_URL:-postgresql://case_adm_app:${POSTGRES_APP_PASSWORD:-case_adm_app_dev}@postgres:5432/case_adm?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://case_adm:case_adm_dev@postgres:5432/case_adm?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-32chars}
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_BUCKET_DOCUMENTS: ${SEAWEEDFS_BUCKET_DOCUMENTS:-documents}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-admin}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-admin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-nao-responda@case.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Portal do Credor}
      JUDICIAL_NOTIFICATION_EMAIL: ${JUDICIAL_NOTIFICATION_EMAIL:-documentos@case.local}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # Hot-reload inside Docker (polling fallback when inotify is flaky on mounts)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../:/app:cached
      - /app/node_modules
      - /app/backend/node_modules
      - /app/backend/dist
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: on alpine `localhost` resolves to ::1 first and
      # the app binds IPv4 only, which would leave the container permanently unhealthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      # Root context: the Dockerfile installs the pnpm workspace, so it needs the
      # root manifests and pnpm-lock.yaml. Volumes below do the hot-reload.
      context: ..
      dockerfile: frontend/Dockerfile
      target: base
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install && pnpm --filter frontend dev"
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      BACKEND_INTERNAL_URL: http://backend:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../:/app:cached
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next
      - /app/backend/dist
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      # Local dev serves plain HTTP on :80; production overrides with the
      # public hostname (required, no default) for auto-HTTPS.
      CADDY_SITE: ${CADDY_SITE:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # Optional: mailpit for local e-mail preview (verification / reset / new-document)
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
volumes:
  postgres_data:
  seaweedfs_data:
  caddy_data:
  caddy_config:
