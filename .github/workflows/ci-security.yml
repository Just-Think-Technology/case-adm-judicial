# purpose: Shared security and deploy validation (secret-scan, docker-lint, compose-validate).
# Required by .agents/security/ci-pipeline.md — runs on every PR/push.

name: ci-security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          extra_args: --only-verified

  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Hadolint backend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Hadolint frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Provide .env for compose (root .env is gitignored)
        run: test -f .env || cp .env.example .env

      - name: Validate docker compose (dev)
        run: docker compose --file deploy/docker-compose.yml config -q

      - name: Validate docker compose (production)
        # APP_HOST is required with no default (a missing hostname must fail
        # loudly, never serve plaintext). Validation uses a dummy hostname —
        # only the shape is checked here, not a real deploy.
        run: APP_HOST=validate.example.com docker compose --file deploy/docker-compose.yml --file deploy/docker-compose.production.yml config -q
