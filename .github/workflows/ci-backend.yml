# purpose: CI pipeline for backend (lint, typecheck, unit, e2e, security, build, image, codeql, dependency-review).
# Adapted from CI/ci-backend.yml (pode-deixar microservices) to Portal do Credor modular monolith.

name: ci-backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'deploy/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'deploy/**'
      - '.github/workflows/ci-backend.yml'

env:
  NODE_VERSION: 22
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deploy/**'
              - '.github/workflows/ci-backend.yml'

  quick:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      # Runtime mirrors production topology: the app connects as the
      # least-privilege role, migrations as the owner (DIRECT_URL).
      DATABASE_URL: postgresql://case_adm_app:case_adm_app_test@localhost:5432/case_adm_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/case_adm_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE case_adm_test;"

      # The CI postgres image is vanilla, so the role from
      # deploy/postgres-init does not exist here — create it the same way, with
      # default privileges so tables made by migrate deploy inherit the grants.
      - name: Create least-privilege app role
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d case_adm_test
          -c "CREATE ROLE case_adm_app WITH LOGIN PASSWORD 'case_adm_app_test';"
          -c "GRANT CONNECT ON DATABASE case_adm_test TO case_adm_app;"
          -c "GRANT USAGE ON SCHEMA public TO case_adm_app;"
          -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO case_adm_app;"
          -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE ON SEQUENCES TO case_adm_app;"

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Apply Prisma migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - run: pnpm --filter backend lint
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend test

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Create E2E test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE case_adm_test_e2e;"

      # Same topology as production: the app boots as case_adm_app, so the E2E
      # suite proves the least-privilege role can actually run the system.
      - name: Create least-privilege app role
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d case_adm_test_e2e
          -c "CREATE ROLE case_adm_app WITH LOGIN PASSWORD 'case_adm_app_test';"
          -c "GRANT CONNECT ON DATABASE case_adm_test_e2e TO case_adm_app;"
          -c "GRANT USAGE ON SCHEMA public TO case_adm_app;"
          -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO case_adm_app;"
          -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE ON SEQUENCES TO case_adm_app;"

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/case_adm_test_e2e?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/case_adm_test_e2e?schema=public
        run: pnpm --filter backend exec prisma migrate deploy

      # Same engine as production (see deploy/docker-compose.yml): deletion
      # paths talk S3 for real instead of passing against a refused socket.
      # The suite never requires a bucket — deletion treats a missing bucket
      # as nothing to delete — so no provisioning step is needed.
      - name: Start SeaweedFS for E2E
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:3.97 server -dir=/data -s3 -filer -volume.max=0
          code="000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8333/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          [ "$code" != "000" ] || (docker logs seaweedfs && exit 1)

      - name: Build backend
        run: pnpm --filter backend build

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://case_adm_app:case_adm_app_test@localhost:5432/case_adm_test_e2e?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/case_adm_test_e2e?schema=public
          JWT_ACCESS_SECRET: e2e-access-secret-change-me-32chars
          APP_URL: http://localhost:3399
          CORS_ORIGIN: http://localhost:3399
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SEAWEEDFS_ENDPOINT: http://localhost:8333
          SEAWEEDFS_BUCKET_DOCUMENTS: documents
          SEAWEEDFS_ACCESS_KEY: e2e
          SEAWEEDFS_SECRET_KEY: e2e
        run: pnpm --filter backend test:e2e

  security:
    needs: [changes, quick]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec pnpm audit --prod --audit-level=high || echo "::warning::pnpm audit found high vulnerabilities (transitive deepmerge-ts/mysql2/nodemailer) - triage pending"

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          extra_args: --only-verified

  build:
    needs: [changes, quick]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-generate-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: prisma-generate-${{ runner.os }}-

      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter backend build
      - run: pnpm --filter backend typecheck

  image:
    needs: [changes, build, security]
    if: github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image reference to lowercase
        run: echo "IMAGE_REF=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.docker_build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via OIDC/Sigstore)
        run: cosign sign --yes "${{ env.IMAGE_REF }}@${{ steps.docker_build.outputs.digest }}"

  docker-build-check:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false

  codeql:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v3

  dependency-review:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
